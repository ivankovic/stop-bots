    # BEGIN stop-bots (DO NOT EDIT)
    set $stop_bots_block 0;
    if ($http_user_agent ~* "okhttp|BadBot") {
        set $stop_bots_block 1;
    }
    if ($uri ~* "^(/ocs/v2\.php/cloud/capabilities)") {
        set $stop_bots_block 0;
    }
    set $stop_bots_exempt "";
    if ($http_user_agent ~* "Jellyfin Android") {
        set $stop_bots_exempt $uri;
    }
    if ($stop_bots_exempt ~* "^(/videos/)") {
        set $stop_bots_block 0;
    }
    set $stop_bots_exempt "";
    if ($http_user_agent ~* "okhttp") {
        set $stop_bots_exempt $uri;
    }
    if ($stop_bots_exempt ~* "^(/remote\.php/dav/|/remote\.php/webdav/)") {
        set $stop_bots_block 0;
    }
    if ($stop_bots_block) {
        return 403;
    }
    # END stop-bots
