    # BEGIN stop-bots (DO NOT EDIT)
    set $stop_bots_block 0;
    if ($http_user_agent ~* "BadBot") {
        set $stop_bots_block 1;
    }
    if ($server_protocol ~ "^HTTP/1\.") {
        set $stop_bots_block 1;
    }
    if ($http_accept = "") {
        set $stop_bots_block 1;
    }
    if ($http_accept_language = "") {
        set $stop_bots_block 1;
    }
    if ($http_user_agent = "") {
        set $stop_bots_block 1;
    }
    if ($host ~ "^(\d+\.\d+\.\d+\.\d+|\[)") {
        set $stop_bots_block 1;
    }
    if ($ssl_protocol ~ "^TLSv1(\.[01])?$") {
        set $stop_bots_block 1;
    }
    if ($uri ~* "^(/\.well-known/)") {
        set $stop_bots_block 0;
    }
    if ($stop_bots_block) {
        return 403;
    }
    # END stop-bots
