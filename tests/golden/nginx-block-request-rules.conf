    # BEGIN stop-bots (DO NOT EDIT)
    set $stop_bots_block 0;
    if ($http_user_agent ~* "BadBot") {
        set $stop_bots_block 1;
    }
    if ($server_protocol ~ "^HTTP/1\.") {
        set $stop_bots_block 1;
    }
    if ($http_accept = "") {
        set $stop_bots_block 1;
    }
    if ($http_accept_language = "") {
        set $stop_bots_block 1;
    }
    if ($http_user_agent = "") {
        set $stop_bots_block 1;
    }
    if ($host ~ "^(\d+\.\d+\.\d+\.\d+|\[)") {
        set $stop_bots_block 1;
    }
    if ($ssl_protocol ~ "^TLSv1(\.[01])?$") {
        set $stop_bots_block 1;
    }
    if ($http_user_agent ~* "^Mozilla/5\.0 \(compatible\)$|^Mozilla/5\.0 \((Windows NT [0-9.]+(; Win64; x64)?|X11; Linux x86_64|Macintosh; Intel Mac OS X [0-9_]+)\)$|^Mozilla/5\.0 \([^)]*\) AppleWebKit/[0-9.]+( \(KHTML)?$|AppleWebKit/537\.36 Chrome/|^\"|^Mozilla/5\.0\(") {
        set $stop_bots_block 1;
    }
    set $stop_bots_path $uri;
    if ($request_uri ~ "^(/[^?%#\\\]*)(\?.*)?$") {
        set $stop_bots_path $1;
    }
    if ($stop_bots_path ~ "//|/\.\.?(/|$)") {
        set $stop_bots_path $uri;
    }
    if ($stop_bots_path ~* "^(/\.well-known/)") {
        set $stop_bots_block 0;
    }
    if ($stop_bots_block) {
        return 403;
    }
    # END stop-bots
