    # BEGIN stop-bots (DO NOT EDIT)
    set $stop_bots_block 0;
    if ($http_user_agent ~* "BadBot") {
        set $stop_bots_block 1;
    }
    set $stop_bots_path $uri;
    if ($request_uri ~ "^(/[^?%#\\\]*)(\?.*)?$") {
        set $stop_bots_path $1;
    }
    if ($stop_bots_path ~ "//|/\.\.?(/|$)") {
        set $stop_bots_path $uri;
    }
    if ($stop_bots_path ~* "^(/robots\.txt$)") {
        set $stop_bots_block 0;
    }
    if ($stop_bots_trusted) {
        set $stop_bots_block 0;
    }
    if ($stop_bots_block) {
        return 403;
    }
    limit_req zone=stop_bots_untrusted burst=20 nodelay;
    limit_req_status 429;
    location = /robots.txt {
        alias /data/custom_nginx/stop-bots/robots.txt;
        default_type text/plain;
    }
    # END stop-bots
