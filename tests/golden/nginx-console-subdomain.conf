# Written by stop-bots (`Web Access` panel). Safe to edit or delete.
#
# Plain HTTP: the console's password and session cookie are in the clear
# until this host has a certificate for console.example.com. Get one with:
#
#     certbot --nginx -d console.example.com
#
# then pass `--secure-cookie true` to `stop-bots web` or
# `stop-bots install web` so the cookie is HTTPS-only.
server {
    listen 80;
    listen [::]:80;
    server_name console.example.com;

    # BEGIN stop-bots console (DO NOT EDIT)
    location "/" {
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    # END stop-bots console
}
