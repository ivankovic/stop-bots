    # BEGIN stop-bots (DO NOT EDIT)
    set $stop_bots_block 0;
    if ($http_user_agent ~* "BadBot|EvilCrawler") {
        set $stop_bots_block 1;
    }
    if ($request_uri ~* "^(/blog|/feed\.xml|/robots\.txt)") {
        set $stop_bots_block 0;
    }
    if ($stop_bots_block) {
        return 444;
    }
    limit_req zone=stop_bots burst=20 nodelay;
    limit_req_status 429;
    location = /robots.txt {
        alias /etc/stop-bots/nginx/robots.txt;
        default_type text/plain;
    }
    # END stop-bots
