# Per-test time budgets (documented in README.md): unit tests in src/ get
# 300ms, the end-to-end binaries in tests/ get 1s. `cargo nextest run`
# reports any test past its budget as SLOW; a test past the terminate
# multiple is killed and failed. The kill thresholds are deliberately far
# above the budgets — the first test in a CI run pays cold-binary page-in,
# and a killed run should mean "hung", never "the runner was busy".
[profile.default]
slow-timeout = { period = "300ms", terminate-after = 10 }

[[profile.default.overrides]]
filter = "binary(cli) | binary(tui) | binary(web)"
slow-timeout = { period = "1s", terminate-after = 15 }


# The container suite is gated by STOP_BOTS_CONTAINER_TESTS (every test
# returns at once without it), not excluded here — so when it *is* on,
# each test boots a real container or a real systemd and needs a budget
# to match, not the 300ms default that would kill all of them at 3s.
[[profile.default.overrides]]
filter = "binary(container)"
slow-timeout = { period = "60s", terminate-after = 5 }
