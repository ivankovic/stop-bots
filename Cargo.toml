[package]
name = "stop-bots"
version = "0.1.0"
edition = "2021"
authors = ["Marko Ivankovic <marko@ivankovic.me>"]
license = "AGPL-3.0-only"
description = "A TUI that helps you configure your server to stop bad bots and still allow good bots."

[dependencies]
# For TUI
ratatui = "0.27"
crossterm = { version = "0.28", features = ["event-stream"] }

# For reading nginx config files
walkdir = "2"

# For error handling
anyhow = "1"
color-eyre = "0.6"

# For SQLite database
rusqlite = { version = "0.31", features = ["bundled"] }

# For HTTP requests to fetch bot data
reqwest = { version = "0.12", features = ["json"] }

# For JSON serialization/deserialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# For async runtime
tokio = { version = "1.0", features = ["full"] }

# For async trait
async-trait = "0.1"

# For futures utilities
futures = "0.3"

# For CLI argument parsing
clap = { version = "4.4", features = ["derive"] }

# For text width calculation
unicode-width = "0.1"

[dev-dependencies]
# For testing
assert_cmd = "2"
predicates = "3"
tempfile = "3"
uuid = { version = "1", features = ["v4"] }

[profile.release]
opt-level = 2
lto = "thin"
strip = true
