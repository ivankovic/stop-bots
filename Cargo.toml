[package]
name = "stop-bots"
# 0.0.x on purpose: cargo treats every 0.0.z bump as a breaking change, which
# is the honest signal for a crate whose library API is the whole of
# `src/lib.rs` and is not yet designed to be depended on. The value here is the
# binary; the lib is published because the integration tests use it.
version = "0.0.4"
edition = "2021"
rust-version = "1.88"
authors = ["Marko Ivankovic <marko@ivankovic.me>"]
# "or-later" to match the header on every source file, which grants
# "version 3 of the License, or (at your option) any later version".
license = "AGPL-3.0-or-later"
description = "A TUI that helps you configure your server to stop bad bots and still allow good bots."
repository = "https://github.com/ivankovic/stop-bots"
homepage = "https://github.com/ivankovic/stop-bots"
readme = "README.md"
keywords = ["nginx", "firewall", "bots", "crawler", "tui"]
categories = [
    "command-line-utilities",
    "network-programming",
    "web-programming",
    "security",
]
# Internal working documents, kept in the repository but not shipped to
# everyone who downloads the crate: AI instructions, a 150KB decision log, a
# TODO list and a code-review scratchpad. All of them are a click away on
# GitHub. `exclude` rather than `include` deliberately — with `include`, the
# day someone adds a fixture directory and forgets to list it, the published
# crate silently fails to build.
exclude = [
    ".serena/",
    "AGENTS.md",
    "SPECS.md",
    "TODO.md",
    "REVIEW.md",
    "Makefile",
    # Needs Docker to run, and ships a Dockerfile plus a staged binary
    # nobody downloading the crate can use.
    "tests/container",
    "tests/container.rs",
    # Distribution packaging: PKGBUILDs and an ebuild that consume the
    # published artefacts. Of no use to anyone who already has the crate.
    "packaging/",
    # The README's screenshots. Excluded rather than shipped because the
    # README references them by absolute raw.githubusercontent.com URL —
    # relative image paths don't resolve on crates.io — so a packaged copy
    # is bytes nothing ever reads.
    "docs/",
]

# Debian packaging, consumed by `cargo deb` in the release workflow. It lives
# here rather than in a `debian/` directory because there is no native Debian
# build to speak of: the package is one static binary plus its documentation,
# and duplicating the version, description and licence into a second set of
# files is how those go stale.
[package.metadata.deb]
maintainer = "Marko Ivankovic <marko@ivankovic.me>"
license-file = ["LICENSE", "0"]
section = "net"
priority = "optional"
extended-description = """\
A TUI, a web UI and a CLI that help you configure your server to stop bad bots \
without hiding behind a CDN. It classifies known bots by category and blocks \
them in your NGINX config, and renders an nftables or iptables script that \
blocks countries, datacenter ranges and addresses caught scanning your logs. \
Nothing is applied without being asked."""

# Empty, not "$auto". The release build targets musl and links statically, so
# there is no libc6 to depend on -- which is the whole reason for that target:
# one package that installs on any Debian or Ubuntu still receiving updates,
# rather than one per glibc era.
depends = ""

# Neither belongs in `depends`, and the distinction is not pedantry.
#
# A firewall backend is `recommends`: the NGINX half of this tool is entirely
# useful on a host that has neither `nft` nor `iptables`, and `recommends` is
# installed by default anyway, so the only people who notice are the ones who
# passed --no-install-recommends and meant it.
#
# NGINX is `suggests`, weaker still, because the host running this very often
# does not have the package at all -- it has NGINX in a container, with the
# config on a bind mount. `set-nginx-commands` exists for exactly that
# arrangement, and a hard dependency would install a second, idle NGINX on
# every such host to satisfy a file the real one never reads.
recommends = "nftables | iptables"
suggests = "nginx"

# No maintainer scripts, and no unit file, on purpose. `stop-bots install web`
# writes the systemd unit, creates /var/lib/stop-bots 0700 and generates the
# console password -- with a --dry-run that prints the whole plan first,
# because it is the one command in the project that starts a daemon. A package
# that shipped an enabled unit would start a root-run web console on `apt
# install`, which contradicts the rule the rest of the project is built on:
# nothing happens without you.
assets = [
    ["target/release/stop-bots", "usr/bin/", "755"],
    ["README.md", "usr/share/doc/stop-bots/README.md", "644"],
    ["CHANGELOG.md", "usr/share/doc/stop-bots/CHANGELOG.md", "644"],
]

[dependencies]
# For TUI
ratatui = "0.30"
crossterm = { version = "0.29", features = ["event-stream"] }

# For reading nginx config files
walkdir = "2"

# For error handling
anyhow = "1"

# For SQLite database
rusqlite = { version = "0.40", features = ["bundled"] }

# For HTTP requests to fetch bot data
reqwest = { version = "0.13", features = ["json"] }

# For JSON serialization/deserialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# For async runtime
tokio = { version = "1.0", features = ["full"] }

# For futures utilities
futures = "0.3"

# For CLI argument parsing
clap = { version = "4.4", features = ["derive"] }
# For the web UI. `axum` is close to free here: `reqwest` already brings
# `hyper`, `http` and `tower`, so this adds the router and little else.
# Default features off — `axum`'s defaults pull in multipart, ws and
# tracing, none of which this serves.
axum = { version = "0.8", default-features = false, features = [
    "http1",
    "tokio",
    "query",
    "form",
] }

# HTML as a compile-time macro rather than runtime templates: a typo in a
# tag name is a build error, escaping is on by default, and there are no
# template files to ship alongside the binary.
maud = { version = "0.27", features = ["axum"] }

# For hashing the web UI's password. Argon2id is the current default
# recommendation for a password that guards root-equivalent access.
argon2 = "0.6"

# Session ids and CSRF tokens. `rand` was already in the tree; this makes
# the dependency direct because the security of those tokens depends on it.
rand = "0.10"

# Constant-time comparison for session and CSRF tokens, so neither can be
# recovered a byte at a time from response timing.
subtle = { version = "2", default-features = false }
sha2 = "0.11.0"

[dev-dependencies]
# For testing
assert_cmd = "2"
predicates = "3"
tempfile = "3"

# For driving the TUI through a real pty in e2e tests — the pty harness
# itself is in tests/tui.rs, on raw libc, see the comment there for why
# it isn't a crate.
libc = "0.2"
# `ServiceExt::oneshot`, to drive the web router in tests without binding
# a port. The whole middleware stack runs, which is the part worth
# testing; a real listener would only add a port to collide on.
tower = { version = "0.5.3", features = ["util"] }

# Rasterising the TUI's own SVG frames into the animated tour in
# `docs/screenshots/`. Dev-only on purpose: the shipped binary draws to a
# terminal and has no use for an SVG renderer, so `cargo install
# stop-bots` never builds either of these. `resvg` re-exports the `usvg`
# and `tiny-skia` it needs, so this is two entries rather than four.
resvg = "0.48"
gif = "0.14"

# Argon2 is deliberately expensive, and an unoptimised build multiplies
# that by roughly twenty: the same hash that costs ~50ms in the shipped
# binary cost nearly two seconds under `cargo test`, which made every
# web-UI test blow its budget and starved the rest of the suite of CPU.
#
# Optimising these two packages *only* fixes it without touching the cost
# parameters, which are the OWASP-recommended defaults and are what the
# tests should be exercising. Everything else stays unoptimised and
# debuggable.
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3

[profile.release]
opt-level = 2
lto = "thin"
strip = true
