name: Release

# Tag-driven: pushing `v0.0.1` runs the tests, builds the binaries, creates the
# matching GitHub release, and republishes the APT repository on GitHub Pages.
#
# This workflow deliberately does NOT run `cargo publish`. A tag can be deleted
# and re-pushed; a crates.io version cannot — it can only be yanked, and
# yanking does not free the version number. Publishing stays a manual step run
# from a checkout, where the dry run and the real thing happen seconds apart
# with a human watching. See RELEASING.md.
on:
  push:
    tags: ["v*"]

env:
  CARGO_TERM_COLOR: always

# Read-only by default; only the two jobs that publish get write, and only
# `attest` can mint an OIDC token. The build job runs the third-party actions
# that compile the binaries the apt job then signs, and none of them needs to
# push anything or to prove who it is.
permissions:
  contents: read

jobs:
  # The tag is the input to everything below, so verify it agrees with the
  # manifest before building anything. Catches the classic "bumped the version,
  # tagged the previous one" mistake while it is still cheap to fix.
  verify-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Tag must match Cargo.toml version
        run: |
          manifest="$(cargo metadata --no-deps --format-version 1 \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["packages"][0]["version"])')"
          tag="${GITHUB_REF_NAME#v}"
          if [ "$manifest" != "$tag" ]; then
            echo "Tag $GITHUB_REF_NAME implies version $tag, but Cargo.toml says $manifest." >&2
            exit 1
          fi
          echo "Version $manifest matches tag $GITHUB_REF_NAME."

      # The changelog section is the release's notes, so a tag without one
      # would publish a release that says nothing about itself — the same
      # mistake RELEASING.md step 2 exists to prevent, caught here rather
      # than on the release page. A release candidate needs its own
      # `## [0.1.0-rc.1]` section: see scripts/changelog-section.py.
      - name: CHANGELOG.md must have a section for this version
        run: scripts/changelog-section.py "$GITHUB_REF_NAME" > release-notes.md

      # Extracted once, here, and handed to `release` as is: the text that
      # was checked is the text that is published, from the tagged tree,
      # without a second checkout in the job that holds `contents: write`.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-notes
          path: release-notes.md
          if-no-files-found: error

  # The same tests CI runs, on both architectures this workflow ships. A tag
  # is normally pushed after CI went green on main (RELEASING.md step 4), but
  # nothing enforces that order, and a release is the one build that must not
  # start from an untested tree. Reused from test.yml rather than copied, so
  # the gate cannot drift from what CI checks.
  test:
    uses: ./.github/workflows/test.yml
    with:
      runners: '["ubuntu-latest", "ubuntu-24.04-arm"]'

  build:
    needs: [verify-version, test]
    runs-on: ${{ matrix.runner }}
    strategy:
      # Both artifacts are wanted, and one architecture failing should still
      # leave the other buildable and inspectable rather than cancelled.
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-musl
            debarch: amd64
            cc: CC_x86_64_unknown_linux_musl
          # A native arm64 runner rather than cross-compilation. `rusqlite`
          # is built with `bundled`, so every release build compiles SQLite
          # from C, and a cross-toolchain that has to keep satisfying that is
          # a standing maintenance cost for something GitHub now gives away.
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            debarch: arm64
            cc: CC_aarch64_unknown_linux_musl
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ matrix.target }}

      # musl, and therefore one package that installs on every Debian and
      # Ubuntu still receiving updates. Linking against glibc instead would
      # inherit a version floor from whatever the runner ships, leaving the
      # choice between a package that refuses to install on anything older
      # and a container build per glibc era.
      #
      # Viable here only because the dependency tree has no C TLS in it —
      # `reqwest` resolves to `rustls` — so `musl-gcc` has exactly one thing
      # to compile: the SQLite that `rusqlite`'s `bundled` feature carries.
      - name: Install musl toolchain
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y musl-tools

      - name: Install cargo-deb
        uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2.87.32
        with:
          tool: cargo-deb

      # The target-specific `CC_*` rather than a bare `CC`: build scripts and
      # proc macros are compiled for the *host*, and pointing their C compiler
      # at musl too is how a build that looks cross-aware fails inside a
      # dependency nobody here wrote.
      - name: Build
        env:
          ${{ matrix.cc }}: musl-gcc
        run: cargo build --release --locked --target ${{ matrix.target }}

      # A "static" binary that turns out not to be static is the single
      # failure this target choice exists to prevent, and it would otherwise
      # surface as a broken install on someone else's machine rather than
      # here.
      - name: Verify the binary is static and runs
        run: |
          binary="target/${{ matrix.target }}/release/stop-bots"
          # `readelf -d`, not `ldd`. A static binary makes ldd say either
          # "statically linked" or "not a dynamic executable" depending on
          # its libc and whether the binary is PIE, and an earlier version of
          # this step grepped for one of those two strings and failed the
          # build on a binary that was correctly static. What actually
          # decides it is whether the ELF asks for any shared library at all:
          # a static-pie binary still has a .dynamic section, but no
          # DT_NEEDED entry in it.
          needed="$(readelf -d "$binary" 2>/dev/null | grep 'NEEDED' || true)"
          if [ -n "$needed" ]; then
            echo "::error::$binary links shared libraries, so Depends: is a lie"
            echo "$needed"
            exit 1
          fi
          file "$binary"
          # And that it runs at all, which catches a build that produced the
          # wrong machine type — the way a cross-build goes wrong quietly.
          "$binary" --version

      # From the binary's own clap definition, into the paths
      # `[package.metadata.deb]` names: a man page per verb and the bash,
      # zsh and fish completions. Run on the binary just built, which is
      # why this is a step here and not a build script.
      - name: Generate man pages and completions
        run: target/${{ matrix.target }}/release/stop-bots generate-docs --out target/assets

      # `--no-build`, because the step above already built it — with
      # `--locked`, which cargo-deb's own build would not have used.
      # `--no-strip` because `[profile.release]` already sets `strip = true`,
      # and cargo-deb's stripping step shells out to a `strip` that does not
      # necessarily match the target.
      - name: Build .deb
        # `--deb-version` so a release candidate is `0.1.0~rc.1-1`, which
        # sorts before `0.1.0-1`; see scripts/deb-version.sh.
        run: >-
          cargo deb --no-build --no-strip --deb-version "$(scripts/deb-version.sh)"
          --target ${{ matrix.target }} --output dist/

      # The tarball stays, for the AUR `-bin` package and for anyone who would
      # rather not add a repository to their machine. Same binary as the .deb.
      - name: Package tarball
        run: |
          version="${GITHUB_REF_NAME#v}"
          name="stop-bots-${version}-${{ matrix.target }}"
          mkdir -p "dist/${name}"
          cp "target/${{ matrix.target }}/release/stop-bots" README.md LICENSE "dist/${name}/"
          # The man pages and completions the .deb ships, so the AUR `-bin`
          # package can install them too rather than being the one route
          # without `man stop-bots`. Same layout as target/assets: man/ and
          # completions/.
          cp -r target/assets/man target/assets/completions "dist/${name}/"
          tar -czf "dist/${name}.tar.gz" -C dist "${name}"
          rm -rf "dist/${name}"

      # One `.sha256` beside every asset, the .deb included: someone who
      # downloads a single file should not need a second, all-assets file to
      # check it. packaging/bump.py reads the tarballs' ones for the AUR
      # `-bin` package. `release` adds a SHA256SUMS covering all of them.
      - name: Checksums
        working-directory: dist
        run: |
          for asset in *.tar.gz *.deb; do
            sha256sum "$asset" > "$asset.sha256"
          done
          cat ./*.sha256

      - name: Inspect the package
        run: |
          dpkg-deb --info dist/*.deb
          dpkg-deb --contents dist/*.deb

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-${{ matrix.debarch }}
          path: dist/*
          if-no-files-found: error

  # SLSA build provenance for every binary artefact: a signed statement,
  # logged in Sigstore's public transparency log, that this file was built
  # by this workflow from this commit of this repository. Checked with
  # `gh attestation verify` (RELEASING.md, "Verifying a download").
  #
  # Its own job, so the two permissions it needs are held by nothing but
  # first-party actions: `id-token: write` lets a job mint a token that
  # proves it is this workflow, and neither the build job's third-party
  # toolchain actions nor the release action should be able to. Before
  # `release` rather than after, so a published release always has its
  # attestations; a failure here stops the release instead of shipping
  # one that `gh attestation verify` rejects.
  #
  # The artefacts are attested as `release` will upload them — downloaded
  # from this run, not rebuilt — so the digests are the published bytes.
  # The `.sha256` files and SHA256SUMS are not subjects: they describe the
  # artefacts, and what they say is checked against the attested ones.
  attest:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.deb

  release:
    needs: [verify-version, build, attest]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-notes
          path: notes

      # Each build job wrote a `.sha256` per asset; checking them here
      # proves the bytes survived the artifact round trip, and SHA256SUMS
      # puts every asset of the release in one file for `sha256sum -c`.
      #
      # Not GPG-signed. The only key this workflow holds is the APT
      # repository's, and it is imported in the `apt` job alone; bringing it
      # into this job would hand it to the third-party release action for
      # the sake of a second signature over what the provenance attestation
      # already vouches for.
      - name: Verify the checksums and write SHA256SUMS
        working-directory: dist
        run: |
          for sum in *.sha256; do
            sha256sum --check --strict "$sum"
          done
          sha256sum *.tar.gz *.deb > SHA256SUMS
          cat SHA256SUMS

      - name: Create release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: dist/*
          fail_on_unmatched_files: true
          # The changelog's section for this tag, as `verify-version`
          # extracted it, rather than GitHub's generated notes: those are a
          # list of commit titles, and the changelog is what is written for
          # the people upgrading.
          body_path: notes/release-notes.md
          # Marked as a pre-release while the version is 0.0.x — cargo treats
          # every 0.0.z bump as breaking, and the release page should say the
          # same thing the version number does — and for a release candidate
          # (`v0.1.0-rc.1`: any tag with a semver pre-release part).
          prerelease: ${{ startsWith(github.ref_name, 'v0.0.') || contains(github.ref_name, '-') }}

  # Republishes the APT repository with this release added to it.
  #
  # After `release` rather than beside it, so that a failure here still leaves
  # a complete GitHub release behind: the .debs are downloadable and the
  # tarballs are where the AUR package expects them, and this job can be
  # re-run on its own to fix the repository. The other order would leave a
  # repository advertising a release that does not exist.
  #
  # Not for a release candidate. The repository has one channel, `stable`,
  # and `apt upgrade` would move every host that uses it onto a build that
  # is still being tried out. A candidate's .debs are on its GitHub release
  # for anyone who wants one.
  apt:
    needs: release
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # The tagged tree, for scripts/build-apt-repo.sh and the landing page.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: source

      # And the published repository, which holds every previously released
      # .deb — see build-apt-repo.sh for why that history is load-bearing.
      # `gh-pages` does not exist before the first release, so a missing
      # branch starts an orphan rather than failing.
      - name: Check out gh-pages
        run: |
          if git clone --branch gh-pages --single-branch \
               "https://github.com/${GITHUB_REPOSITORY}.git" pages 2>/dev/null; then
            echo "Found gh-pages with $(find pages/pool -name '*.deb' 2>/dev/null | wc -l) package(s)."
          else
            echo "No gh-pages branch yet — starting one."
            git clone "https://github.com/${GITHUB_REPOSITORY}.git" pages
            cd pages
            git checkout --orphan gh-pages
            git rm -rfq --ignore-unmatch .
          fi

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: dist-*
          merge-multiple: true
          path: debs

      - name: Install apt-ftparchive
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y apt-utils

      # The key id is read back from what was imported rather than kept as a
      # second secret, which cannot then disagree with the first.
      - name: Import the signing key
        id: gpg
        env:
          APT_GPG_PRIVATE_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
        run: |
          if [ -z "${APT_GPG_PRIVATE_KEY}" ]; then
            echo "::error::secret APT_GPG_PRIVATE_KEY is not set — see RELEASING.md"
            exit 1
          fi
          printf '%s' "${APT_GPG_PRIVATE_KEY}" | gpg --batch --import
          key="$(gpg --list-secret-keys --with-colons | awk -F: '/^fpr:/ { print $10; exit }')"
          echo "key=${key}" >> "$GITHUB_OUTPUT"
          echo "Imported ${key}"

      - name: Build and sign the repository
        env:
          GPG_PASSPHRASE: ${{ secrets.APT_GPG_PASSPHRASE }}
        run: source/scripts/build-apt-repo.sh pages debs "${{ steps.gpg.outputs.key }}"

      - name: Add the landing page
        run: |
          cp source/packaging/apt/index.html pages/index.html
          # Pages runs everything through Jekyll by default, which drops any
          # path beginning with an underscore and rewrites what it takes for
          # a template. An APT repository is a set of files whose checksums
          # have been signed, so nothing may rewrite any part of it.
          touch pages/.nojekyll

      # apt verifies what it downloads against the signed index, so a
      # repository published wrongly fails closed rather than installing
      # something unexpected. Worth proving before the push all the same: a
      # broken index is an `apt update` error on every machine configured for
      # it, and those people did nothing to deserve it.
      - name: Verify the signatures and the indices
        run: |
          cd pages
          gpg --verify dists/stable/InRelease
          gpg --verify dists/stable/Release.gpg dists/stable/Release
          version="${GITHUB_REF_NAME#v}"
          for arch in amd64 arm64; do
            index="dists/stable/main/binary-${arch}/Packages"
            # `0.0.3-1`, not `0.0.3`: a Debian version carries a package
            # revision after the upstream one, and cargo-deb defaults it to
            # -1. Matching the bare version failed the first real release on
            # a repository that was entirely correct.
            if ! grep -qE "^Version: ${version}(-[0-9]+)?$" "$index"; then
              echo "::error::${index} does not list ${version}; it has:"
              grep '^Version: ' "$index" || echo "  (no Version: field at all)"
              exit 1
            fi
            # Every Filename: must resolve, or apt 404s at install time
            # having already told the user the package was available.
            #
            # Collected in a loop rather than piped into `while read`: that
            # runs the loop in a subshell, where `exit 1` leaves the subshell
            # and the step carries on succeeding -- a check that cannot fail
            # is worse than no check, because the log says it passed.
            missing=""
            for f in $(awk '/^Filename: /{print $2}' "$index"); do
              [ -f "$f" ] || missing="${missing} ${f}"
            done
            if [ -n "$missing" ]; then
              echo "::error::${index} points at missing file(s):${missing}"
              exit 1
            fi
          done
          echo "Both indices carry ${version}, and every Filename: resolves."

      - name: Publish
        run: |
          cd pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Repository unchanged — nothing to publish."
            exit 0
          fi
          git commit -m "apt: publish ${GITHUB_REF_NAME}"
          git push "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
