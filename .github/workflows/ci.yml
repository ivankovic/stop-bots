name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Weekly, because two of these jobs go red without anything here
  # changing: `audit` when an advisory is published against a dependency,
  # and `test` when a new `stable` lands a lint. Finding either on a
  # schedule beats finding it in someone's unrelated pull request.
  schedule:
    - cron: "17 5 * * 1"

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --check

      # `-D warnings` goes on the clippy invocation rather than in a global
      # RUSTFLAGS: RUSTFLAGS reaches dependency compilation too, so a new
      # compiler lint firing inside some crate we merely depend on would fail
      # this job for something nobody here can fix.
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Install nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      # nextest rather than plain `cargo test`, for one reason: it reports
      # per-test wall time and flags any test that exceeds the budgets in
      # .config/nextest.toml (300ms per unit test, 1s per e2e test) as
      # SLOW — which is what keeps those budgets a practice instead of a
      # sentence in the README. Runaway tests are killed at a generous
      # multiple of the budget, so a hang fails the build rather than
      # stalling it.
      - name: Test
        run: cargo nextest run

  # This project is security software, so learning about an advisory in its
  # own dependency tree from someone else's bug report is not acceptable.
  # Scheduled as well as on push: an advisory is published against code
  # that has not changed, so a job that only runs on a commit finds out
  # whenever the next commit happens to land.
  #
  # `unsound` and `yanked` rather than `--deny warnings`, which is all four
  # categories and so includes `unmaintained`. An unmaintained transitive
  # crate is not something anyone here can act on — you cannot maintain
  # someone else's crate, and the upstream that depends on it moves when it
  # moves — so denying it turns this red on a Monday morning for no
  # available action, which is how a job starts getting ignored. The two
  # kept are the ones that earned the job: the advisories in `anyhow` and
  # `lru` that found it were `unsound`, and both had patches published.
  # Vulnerabilities fail regardless of `--deny`; they need no flag.
  #
  # No allow-list. Every advisory raised here so far had a patched version
  # already published, and an ignore entry would have hidden two of them.
  # If one genuinely has no fix, add it here with the reason and a link.
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      - name: Audit dependencies
        run: cargo audit --deny unsound --deny yanked

  # A separate job so a bump in a dependency's own MSRV shows up as this job
  # going red, rather than as a confusing failure for someone on an older
  # toolchain months later.
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust (MSRV from Cargo.toml)
        uses: dtolnay/rust-toolchain@1.88.0

      - uses: Swatinem/rust-cache@v2

      - run: cargo check --all-targets

  # The only job where generated NGINX and nftables output meets the real
  # parsers, and where a firewall rule is checked by sending actual
  # packets at it. Separate from `test` because it needs Docker and
  # NET_ADMIN, which the unit suite must never require.
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # The failure output is echoed back as workflow *annotations*, not
      # just left in the log. Job logs need admin on this repository,
      # while annotations are readable by anyone who can see the run — so
      # without this, a red `container` job says only "exit code 101" to
      # everyone except the owner, and the flakes this suite is prone to
      # (it races a real systemd, a real nginx and a real SQLite) cost a
      # reproduction attempt each to identify. `pipefail` because the
      # exit status that matters is cargo's, not tee's.
      - name: End-to-end against real nginx and nftables
        shell: bash
        run: |
          set -o pipefail
          if STOP_BOTS_CONTAINER_TESTS=1 cargo test --test container 2>&1 | tee /tmp/container.log; then
            exit 0
          fi
          echo "::error::container suite failed"
          # GitHub keeps only the first handful of error annotations per
          # step, so this spends them on the two things worth having: the
          # names of the tests that failed, then the panic text of the
          # first one.
          grep -E '^    [a-z_0-9]+$' /tmp/container.log | head -5 | while IFS= read -r line; do
            echo "::error::failed test:${line}"
          done
          grep -A 8 '^---- ' /tmp/container.log | head -12 | while IFS= read -r line; do
            [ -n "$line" ] && echo "::error::${line}"
          done
          exit 1

  # The badge claims a *floor* of 90%, and this is what enforces it. The
  # figure actually achieved is higher — 93.29% at the time of writing, and
  # CONTRIBUTING.md quotes that separately — but a floor set at today's
  # number is a trap rather than a check: 16,012 lines at 93.29% means 47
  # net uncovered lines turns CI red, which is one ordinary function landing
  # slightly under-tested. The first time that happens on an unrelated PR,
  # the quickest fix is to edit the floor down, and then the badge is
  # decoration again — the exact failure this job exists to prevent.
  #
  # So: a floor low enough to survive normal development and high enough
  # that a real collapse in coverage is a red build. Raising it as the
  # achieved figure rises is welcome; it just has to move together with the
  # badge in README.md and the paragraph in CONTRIBUTING.md.
  #
  # The container suite is excluded here, as it is from the local figure:
  # it runs the binary inside Docker, so its coverage never comes back.
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov

      - name: Coverage
        run: cargo llvm-cov --workspace --fail-under-lines 90 --summary-only

  # Catches the class of mistake that only surfaces at publish time: a bad
  # category slug, a missing required field, or a crate that packages fine but
  # does not build from its own tarball.
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo publish --dry-run
